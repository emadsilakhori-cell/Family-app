<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14302b">
<title>حسابداری خانواده</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#14302b;--mute:#6b7f79;--line:#dbe4e0;--in:#0f7a5f;--out:#b94a1c;--acc:#14302b;--accfg:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0e1917;--card:#16262a;--ink:#e6f0ec;--mute:#8aa29b;--line:#27403b;--in:#47c9a2;--out:#f08a5d;--acc:#47c9a2;--accfg:#08201a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 Vazirmatn,Tahoma,sans-serif;padding:env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:800;margin:4px 0 14px}
h2{font-size:15px;font-weight:600;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.total{font-size:30px;font-weight:800}
.mute{color:var(--mute);font-size:13px}
.wallets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.w{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center}
.w b{display:block;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.in{color:var(--in)}.out{color:var(--out)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));background:var(--acc);color:var(--accfg);border:0;border-radius:30px;padding:14px 32px;font:600 16px Vazirmatn,Tahoma,sans-serif}
dialog{border:0;border-radius:18px;padding:18px;width:min(92vw,440px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.seg{display:grid;grid-auto-flow:column;gap:6px;margin-bottom:10px}
.seg button{padding:9px 4px;border:1px solid var(--line);border-radius:10px;background:none;color:var(--ink);font:inherit}
.seg button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.save{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--acc);color:var(--accfg);font:600 16px Vazirmatn,Tahoma,sans-serif}
.del{background:none;border:0;color:var(--mute);font-size:18px;padding:0 6px}
.bar{height:6px;border-radius:3px;background:var(--out);opacity:.75;margin-top:3px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--in);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>حسابداری خانواده</h1>
  <div class="card">
    <div class="mute">موجودی کل خانواده</div>
    <div class="total" id="total">۰</div>
    <div class="wallets" id="wallets"></div>
  </div>
  <h2 id="mtitle">این ماه</h2>
  <div class="card">
    <div class="row"><span>درآمد</span><b class="in" id="minc">۰</b></div>
    <div class="row"><span>هزینه</span><b class="out" id="mexp">۰</b></div>
  </div>
  <h2>هزینه‌ها بر اساس دسته</h2>
  <div class="card" id="cats"></div>
  <h2>آخرین تراکنش‌ها <span class="mute">(برای ویرایش لمس کن)</span></h2>
  <div class="card" id="list"></div>
  <div class="card row" style="margin-top:8px"><span>این گوشی مال: <b id="me"></b></span><button id="chgme" class="del" style="font:600 14px Vazirmatn,Tahoma,sans-serif;color:var(--in)">تغییر</button></div>
  <div class="card row" style="margin-top:8px"><span>واحد پول: <b id="unitname"></b></span><button id="chgunit" class="del" style="font:600 14px Vazirmatn,Tahoma,sans-serif;color:var(--in)">تغییر به ریال/تومان</button></div>
  <p class="mute" id="mode"></p>
  <div class="card row" style="margin-top:8px"><span>کد خانواده: <b id="code" dir="ltr"></b></span><button id="chg" class="del" style="font:600 14px Vazirmatn,Tahoma,sans-serif;color:var(--in)">تغییر کد</button></div>
</main>

<button class="fab" id="add">+ ثبت تراکنش</button>

<dialog id="dlg">
  <div class="seg" id="types">
    <button data-t="expense" class="on">هزینه</button>
    <button data-t="income">درآمد</button>
    <button data-t="topup">واریز به کیف پول</button>
  </div>
  <label>چه کسی؟</label><select id="who"></select>
  <label id="amlabel">مبلغ (تومان)</label><input id="amount" type="number" inputmode="numeric" min="0">
  <div id="catbox"><label>دسته‌بندی</label><select id="cat"></select><button type="button" class="del" id="newcat" style="font:600 14px Vazirmatn,Tahoma,sans-serif;color:var(--in);padding:6px 0">+ دسته‌ی جدید</button></div>
  <label>توضیح (اختیاری)</label><input id="note">
  <button class="save" id="save">ذخیره</button>
  <button class="save" id="cancel" style="background:none;color:var(--mute);margin-top:4px">انصراف</button>
</dialog>

<dialog id="dlg2">
  <b>دسته‌ی جدید</b>
  <label>اسم دسته</label><input id="cn" placeholder="مثلاً ماشین">
  <label>آیکون (یکی را بزن یا ایموجی خودت را بنویس)</label><input id="ci" value="📦" style="font-size:20px">
  <div id="emo" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"></div>
  <div id="clist" style="margin-top:10px"></div>
  <button class="save" id="csave">افزودن</button>
  <button class="save" id="ccancel" style="background:none;color:var(--mute);margin-top:4px">بستن</button>
</dialog>
<dialog id="dlg3">
  <b>این گوشی مال کیست؟</b>
  <div id="whos"></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== تنظیمات: اینجا را ویرایش کن ===== */
const MEMBERS = ["عماد", "میشار", "رونیکا"];      // اسم سه عضو خانواده
const norm = c => (c || "").replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\s+/g, "").toLowerCase();
const FAMILY_CODE = (() => {                           // کد خانواده: اولین بار پرسیده می‌شود؛ بعداً از پایین صفحه قابل تغییر است
  try {
    let c = localStorage.getItem("fc");
    if (!c) { c = norm(prompt("کد خانواده را وارد کن (روی هر سه گوشی یکسان باشد):")); if (c) localStorage.setItem("fc", c); }
    return c || "demo";
  } catch (e) { return "demo"; }
})();
const FIREBASE_CONFIG = {                              // بعد از ساخت پروژه‌ی فایربیس اینجا را پر کن
  apiKey: "AIzaSyAXcFhy20f7BjksHxNhvFfqEM264JHI-Os", authDomain: "family-accounting-250e3.firebaseapp.com", projectId: "family-accounting-250e3", appId: "1:891153065506:web:3c0f4584f92e3eba010c7b"
};
const DEFAULTS = {
  expense: [["رستوران", "🍽️"], ["اجاره", "🏠"], ["قبض", "💡"], ["سفر", "✈️"], ["سوپرمارکت", "🛒"], ["سایر", "📦"]],
  income: [["حقوق", "💼"], ["سایر", "💰"]]
};
const EMOJI = "🍽️ 🏠 💡 ✈️ 🛒 🚗 ⛽ 💊 🎓 👕 🎁 📱 🐾 🎮 💼 💰 🏦 📈 🛠️ 👶 ☕ 🎬 🧾 📦".split(" ");
/* ======================================= */

const $ = id => document.getElementById(id);
const fa = n => Math.round(n).toLocaleString("fa-IR");
let txs = [], custom = [], type = "expense", store;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const kindOf = () => type === "income" ? "income" : "expense";
const catsFor = k => DEFAULTS[k].map(([n, i]) => ({ n, i })).concat(custom.filter(c => c.kind === k).map(c => ({ n: c.name, i: c.icon, id: c.id })));
const iconOf = (n, k) => (catsFor(k).find(c => c.n === n) || { i: k === "income" ? "💰" : "📦" }).i;
let editId = null, UNIT = "toman";
try { UNIT = localStorage.getItem("unit") === "rial" ? "rial" : "toman"; } catch (e) {}
const money = n => fa(UNIT === "rial" ? n * 10 : n);
const unitName = () => UNIT === "rial" ? "ریال" : "تومان";
const balOf = list => { const b = MEMBERS.map(() => 0); list.forEach(t => { const i = MEMBERS.indexOf(t.who); if (i >= 0) b[i] += t.type === "expense" ? -t.amount : t.amount; }); return b; };
const overdraw = (before, after) => { const x = balOf(before), y = balOf(after); const i = y.findIndex((v, k) => v < -0.5 && v < x[k] - 0.5); return i < 0 ? null : { name: MEMBERS[i], bal: x[i] }; };
const fillCats = () => { $("cat").innerHTML = catsFor(kindOf()).map(c => `<option value="${esc(c.n)}">${c.i} ${esc(c.n)}</option>`).join(""); };

// ذخیره‌سازی: فایربیس (هماهنگ بین گوشی‌ها) یا حالت آزمایشی روی همین دستگاه
if (FIREBASE_CONFIG.apiKey) {
  firebase.initializeApp(FIREBASE_CONFIG);
  const col = firebase.firestore().collection("families").doc(FAMILY_CODE).collection("tx");
  store = {
    add: t => col.add(t),
    del: id => col.doc(id).delete(),
    upd: (id, d) => col.doc(id).update(d),
    watch: cb => col.orderBy("ts", "desc").onSnapshot(s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))))
  };
  $("mode").textContent = "متصل به فایربیس؛ تغییرات روی هر سه گوشی همزمان دیده می‌شود.";
} else {
  let cbk;
  const load = () => { try { return JSON.parse(localStorage.getItem("tx") || "[]"); } catch (e) { return []; } };
  const save = a => { try { localStorage.setItem("tx", JSON.stringify(a)); } catch (e) {} };
  const push = () => cbk && cbk(load().sort((a, b) => b.ts - a.ts));
  store = {
    add: t => { const a = load(); a.push({ ...t, id: String(Date.now()) }); save(a); push(); },
    del: id => { save(load().filter(x => x.id !== id)); push(); },
    upd: (id, d) => { save(load().map(x => x.id === id ? { ...x, ...d } : x)); push(); },
    watch: cb => { cbk = cb; push(); }
  };
  $("mode").textContent = "حالت آزمایشی: داده‌ها فقط روی همین گوشی ذخیره می‌شود. بعد از وصل کردن فایربیس، بین هر سه گوشی همگام می‌شود.";
}

function render() {
  const bal = MEMBERS.map(() => 0);
  const now = new Date(), ym = now.getFullYear() + "-" + now.getMonth();
  let inc = 0, exp = 0; const cat = {};
  txs.forEach(t => {
    const i = MEMBERS.indexOf(t.who); if (i < 0) return;
    if (t.type === "expense") bal[i] -= t.amount; else bal[i] += t.amount;
    const d = new Date(t.ts);
    if (d.getFullYear() + "-" + d.getMonth() !== ym) return;
    if (t.type === "income") inc += t.amount;
    if (t.type === "expense") { exp += t.amount; cat[t.cat] = (cat[t.cat] || 0) + t.amount; }
  });
  $("total").textContent = money(bal.reduce((a, b) => a + b, 0));
  $("wallets").innerHTML = MEMBERS.map((m, i) => `<div class="w"><span class="mute">${m}</span><b class="${bal[i] < 0 ? "out" : ""}">${money(bal[i])}</b></div>`).join("");
  $("mtitle").textContent = "این ماه (" + now.toLocaleDateString("fa-IR", { month: "long" }) + ")";
  $("minc").textContent = money(inc); $("mexp").textContent = money(exp);
  const max = Math.max(1, ...Object.values(cat));
  const keys = Object.keys(cat).sort((a, b) => cat[b] - cat[a]);
  $("cats").innerHTML = keys.length ? keys.map(k => `<div style="margin:8px 0"><div class="row" style="border:0;padding:0"><span>${iconOf(k, "expense")} ${k}</span><b>${money(cat[k])}</b></div><div class="bar" style="width:${cat[k] / max * 100}%"></div></div>`).join("") : '<span class="mute">هنوز هزینه‌ای ثبت نشده.</span>';
  const label = { expense: "هزینه", income: "درآمد", topup: "واریز" };
  $("list").innerHTML = txs.length ? txs.slice(0, 30).map(t => `<div class="row"><div data-edit="${t.id}" style="cursor:pointer;flex:1"><b>${t.type === "topup" ? label.topup : iconOf(t.cat, t.type) + " " + (t.cat || label[t.type])}</b> <span class="mute">${t.who}${t.note ? " · " + t.note.replace(/</g, "&lt;") : ""}</span><div class="mute">${new Date(t.ts).toLocaleDateString("fa-IR")}</div></div><div><b class="${t.type === "expense" ? "out" : "in"}">${t.type === "expense" ? "−" : "+"}${money(t.amount)}</b><button class="del" data-id="${t.id}" aria-label="حذف">×</button></div></div>`).join("") : '<span class="mute">با دکمه‌ی پایین اولین تراکنش را ثبت کن.</span>';
}

$("who").innerHTML = MEMBERS.map(m => `<option>${m}</option>`).join("");
fillCats();
$("add").onclick = () => { editId = null; $("save").textContent = "ذخیره"; $("amount").value = ""; $("note").value = ""; $("who").value = ME || MEMBERS[0]; fillCats(); $("dlg").showModal(); };
const openEdit = t => {
  editId = t.id; type = t.type;
  [...$("types").children].forEach(b => b.classList.toggle("on", b.dataset.t === type));
  $("catbox").style.display = type === "topup" ? "none" : ""; fillCats();
  if (t.cat) $("cat").value = t.cat;
  $("who").value = t.who; $("amount").value = UNIT === "rial" ? t.amount * 10 : t.amount; $("note").value = t.note || "";
  $("save").textContent = "ذخیره‌ی تغییرات"; $("dlg").showModal();
};
$("cancel").onclick = () => $("dlg").close();
$("types").onclick = e => {
  if (!e.target.dataset.t) return;
  type = e.target.dataset.t;
  [...$("types").children].forEach(b => b.classList.toggle("on", b === e.target));
  $("catbox").style.display = type === "topup" ? "none" : ""; fillCats();
};
$("save").onclick = () => {
  const amount = Number($("amount").value) / (UNIT === "rial" ? 10 : 1);
  if (!(amount > 0)) { $("amount").focus(); return; }
  const rec = { type, who: $("who").value, amount, cat: type === "topup" ? "" : $("cat").value, note: $("note").value.trim() };
  const after = editId ? txs.map(t => t.id === editId ? { ...t, ...rec } : t) : txs.concat([{ ...rec, id: "new" }]);
  const bad = overdraw(txs, after);
  if (bad) { alert("موجودی " + bad.name + " کافی نیست (الان " + money(bad.bal) + " " + unitName() + "). اول «واریز به کیف پول» ثبت کن."); return; }
  if (editId) store.upd(editId, rec); else store.add({ ...rec, ts: Date.now() });
  editId = null; $("amount").value = ""; $("note").value = ""; $("dlg").close();
};
$("list").onclick = e => {
  const d = e.target.dataset.id;
  if (d) {
    if (!confirm("این تراکنش حذف شود؟")) return;
    const bad = overdraw(txs, txs.filter(t => t.id !== d));
    if (bad) { alert("با حذف این تراکنش، موجودی " + bad.name + " منفی می‌شود."); return; }
    store.del(d); return;
  }
  const ed = e.target.closest("[data-edit]");
  if (ed) { const t = txs.find(x => x.id === ed.dataset.edit); if (t) openEdit(t); }
};
$("code").textContent = FAMILY_CODE;
$("chg").onclick = () => {
  const c = norm(prompt("کد جدید خانواده را وارد کن:", FAMILY_CODE));
  if (!c || c === FAMILY_CODE) return;
  try { localStorage.setItem("fc", c); } catch (e) {}
  location.reload();
};

// ---- دسته‌های دلخواه (در همان دفتر ذخیره می‌شوند و بین گوشی‌ها همگام‌اند) ----
const renderCustom = () => { $("clist").innerHTML = custom.filter(c => c.kind === kindOf()).map(c => `<div class="row"><span>${c.icon} ${esc(c.name)}</span><button class="del" data-id="${c.id}" aria-label="حذف">×</button></div>`).join(""); };
$("emo").innerHTML = EMOJI.map(e => `<button type="button" class="w" data-e="${e}" style="font-size:20px;padding:6px 8px">${e}</button>`).join("");
$("emo").onclick = e => { if (e.target.dataset.e) $("ci").value = e.target.dataset.e; };
$("newcat").onclick = () => { $("cn").value = ""; $("ci").value = "📦"; renderCustom(); $("dlg2").showModal(); };
$("ccancel").onclick = () => $("dlg2").close();
$("csave").onclick = () => {
  const n = $("cn").value.trim(); if (!n) { $("cn").focus(); return; }
  store.add({ type: "cat", kind: kindOf(), name: n, icon: $("ci").value.trim() || "📦", ts: Date.now() });
  $("dlg2").close(); setTimeout(() => { fillCats(); $("cat").value = n; }, 500);
};
$("clist").onclick = e => { const id = e.target.dataset.id; if (id && confirm("این دسته حذف شود؟ تراکنش‌های قبلی می‌مانند.")) store.del(id); };

const setUnitUI = () => { $("unitname").textContent = unitName(); $("amlabel").textContent = "مبلغ (" + unitName() + ")"; };
$("chgunit").onclick = () => { UNIT = UNIT === "rial" ? "toman" : "rial"; try { localStorage.setItem("unit", UNIT); } catch (e) {} setUnitUI(); render(); };
setUnitUI();

// ---- این گوشی مال کیست؟ ----
let ME = null; try { ME = localStorage.getItem("me"); } catch (e) {}
if (!MEMBERS.includes(ME)) ME = null;
const pickMe = () => { $("whos").innerHTML = MEMBERS.map(m => `<button class="save" data-m="${m}">${m}</button>`).join(""); $("dlg3").showModal(); };
$("whos").onclick = e => { const m = e.target.dataset.m; if (!m) return; ME = m; try { localStorage.setItem("me", m); } catch (x) {} $("me").textContent = m; $("dlg3").close(); };
$("chgme").onclick = pickMe;
$("me").textContent = ME || "—";

store.watch(a => {
  txs = a.filter(t => t.type !== "cat");
  custom = a.filter(t => t.type === "cat");
  render();
  if ($("dlg2").open) renderCustom();
  fillCats();
});
if (!ME) pickMe();
</script>
</body>
</html>
